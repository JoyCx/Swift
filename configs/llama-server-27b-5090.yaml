# Single RTX 5090 (32 GB): serve a QUANTIZED Swift-Qwen3.8-27B GGUF with llama-server and run
# the measurement + inference-time-penalizer path. Fits in 32 GB; native Windows, no WSL needed.
# This path does NOT do weight surgery or training (those need the BF16 weights ~54 GB).
name: swift27b-5090-measure
run_dir: runs/swift27b-5090
backend:
  kind: openai
  model: swift-27b                 # any name; must match llama-server --alias (or omit --alias)
  base_url: http://127.0.0.1:8080/v1
  reasoning_effort: xhigh
  temperature: 0.7
  top_p: 0.95
  max_tokens: 16384                 # 5090 KV budget; raise if you serve with more context
  concurrency: 2                    # one GPU, keep this low
  extra:
    timeout: 7200
    send_reasoning_effort_top_level: false   # llama-server rejects unknown top-level keys
    kl_topk: 20
bank:
  seeds: [data/tasks/coding_seed.jsonl, data/tasks/knowledge_seed.jsonl, data/tasks/math_seed.jsonl]
  domains: [coding, knowledge, math]
  decontam_against: []
  ngram: 13
  split: {mine: 0.6, calib: 0.2, eval: 0.2}
rollout: {samples_per_task: 2}
settle: {checkpoints: 8, answer_max_tokens: 512, min_think_tokens: 200}
eval: {seeds: 5, bootstrap: 2000, accuracy_tolerance: 0.01}
