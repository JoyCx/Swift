# Single RTX 5090 (32 GB): run the FULL pipeline (direction, edit, search, abliterate, LoRA,
# OPD, GSPO) on an 8B in-family reasoning model that fits in BF16 (~16 GB weights). Use this to
# prove the method locally, then move the recipe to the 27B on a multi-GPU / rented box.
name: qwen3-8b-5090-full
run_dir: runs/qwen3-8b
backend:
  kind: hf
  model: Qwen/Qwen3-8B             # BF16 ~16 GB; swap for any small model with a thinking block
  dtype: bfloat16
  device_map: auto
  reasoning_effort: xhigh
  temperature: 0.7
  top_p: 0.95
  max_tokens: 8192
  concurrency: 1
direction:
  layers: []                       # auto-sweep middle half
  matrices: [self_attn.o_proj, mlp.down_proj]
  ridge_lambda: 0.01
  gamma: 1.0
  gamma_kernel: gaussian
  kernel_width: 4.0
  atoms: [coding, knowledge, format, language]
bank:
  seeds: [data/tasks/coding_seed.jsonl, data/tasks/knowledge_seed.jsonl, data/tasks/math_seed.jsonl]
  domains: [coding, knowledge, math]
  split: {mine: 0.6, calib: 0.2, eval: 0.2}
settle: {checkpoints: 8, answer_max_tokens: 512, min_think_tokens: 150}
eval: {seeds: 5, bootstrap: 2000, accuracy_tolerance: 0.01}
