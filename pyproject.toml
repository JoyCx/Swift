[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swiftlab"
version = "0.1.0"
description = "Harness for surgical overthinking ablation, token-penalty tuning, quantization and paired evaluation of reasoning LLMs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyyaml>=6"]

[project.optional-dependencies]
hf = ["torch>=2.2", "transformers>=4.45", "safetensors>=0.4", "accelerate"]
train = ["peft>=0.12", "datasets"]
search = ["optuna>=3.6"]
quant = ["llmcompressor"]
dev = ["pytest"]

[project.scripts]
swiftlab = "swiftlab.cli:main"

[tool.setuptools.packages.find]
include = ["swiftlab*"]
